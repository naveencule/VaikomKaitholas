<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaikom Kaitholas - Official Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Website Content -->
    <main class="main-content">
        <header>
            <h1>വൈക്കം കൈതോലാസ് | Vaikom Kaitholas</h1>
            <p>A passionate music collective from Vaikom</p>
        </header>
        
        <section class="hero">
            <h2>Welcome to our musical journey</h2>
            <p>Discover our story, book us for events, and learn about our mission through our interactive chat assistant.</p>
        </section>
    </main>

    <!-- Chatbot Widget -->
    <div id="vk-chat-widget" class="vk-widget">
        <!-- Chat Bubble Button -->
        <button id="vk-bubble-btn" class="vk-bubble" aria-label="Open chat">
            <span class="vk-bubble-icon">💬</span>
        </button>
        
        <!-- Chat CTA Text -->
        <div id="vk-chat-cta" class="vk-cta">
            <span>Need help? Chat with us!</span>
        </div>
        
        <!-- Chat Window -->
        <div id="vk-chat-window" class="vk-window">
            <!-- Chat Header -->
            <div id="vk-chat-header" class="vk-header">
                <div class="vk-header-info">
                    <h3>വൈക്കം കൈതോലാസ്</h3>
                    <span class="vk-status">Online</span>
                </div>
                <button id="vk-close-btn" class="vk-close" aria-label="Close chat">×</button>
            </div>
            
            <!-- Chat Body -->
            <div id="vk-chat-body" class="vk-body">
                <!-- Messages will be dynamically added here -->
            </div>
            
            <!-- Chat Footer -->
            <div id="vk-chat-footer" class="vk-footer">
                <!-- Buttons will be dynamically added here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
