<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Kaitholas Video Gallery</title>
<style>
  
.kaitholas-video-section {
  position: relative;
  background: #fff; /* Removed blue-ish background */
  padding: 2.5rem 0 3rem 0;
  width: 100%;
  max-width: 100vw;
  overflow: hidden;
}

.kaitholas-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2rem 1.2rem 2rem;
}

.kaitholas-title {
  font-size: 2rem;
  font-weight: 700;
  color: #222; /* Changed to darker, neutral color */
  text-align: center;
  margin: 0;
}

.kaitholas-scroll-container {
  display: flex;
  overflow-x: auto;
  scroll-behavior: smooth;
  gap: 2rem; /* More gap for clarity */
  padding: 0 2rem;
  scrollbar-width: thin;
  scrollbar-color: #b7b7b7 #eee;
}

.kaitholas-scroll-container::-webkit-scrollbar {
  height: 8px;
  background: #eee;
}

.kaitholas-scroll-container::-webkit-scrollbar-thumb {
  background: #b7b7b7;
  border-radius: 8px;
}

.kaitholas-video-card {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 4px 24px 0 #00000010;
  min-width: 320px;
  max-width: 320px;
  height: 240px;
  flex: 0 0 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s;
  overflow: hidden;
  position: relative;
}
.kaitholas-video-card:hover {
  transform: translateY(-6px) scale(1.035);
  box-shadow: 0 8px 28px 0 #00000026;
}

.kaitholas-thumb {
  width: 100%;
  height: 185px;
  object-fit: cover;
  background: #e1eaf1;
  border-bottom: 1px solid #eee;
  border-radius: 0;
  display: block;
}
.kaitholas-caption {
  font-size: 1.2rem;
  color: #222;
  padding: 1rem 1rem;
  text-align: center;
  font-weight: 500;
  width: 100%;
}

.kaitholas-arrow {
  position: absolute;
  top: 54%;
  z-index: 2;
  background: #fff;
  border: 2px solid #222;
  color: #222;
  font-size: 2.5rem;
  border-radius: 50%;
  width: 3.3rem;
  height: 3.3rem;
  cursor: pointer;
  box-shadow: 0 2px 9px 0 #2221;
  transition: background 0.18s, color 0.18s, border 0.18s, transform 0.22s;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.93;
}
.kaitholas-arrow:hover {
  background: #222;
  color: #fff;
  border: 2px solid #222;
  transform: scale(1.12) translateY(-2px);
}
.kaitholas-arrow-left {
  left: 1.1rem;
  transform: translateY(-50%);
}
.kaitholas-arrow-right {
  right: 1.1rem;
  transform: translateY(-50%);
}

/* Stylish arrows for mobile */
@media (max-width: 900px) {
  .kaitholas-scroll-container {
    gap: 1.3rem;
    padding: 0 1rem;
  }
  .kaitholas-video-card, .kaitholas-thumb {
    min-width: 240px;
    max-width: 240px;
    height: 170px;
  }
  .kaitholas-video-card {
    height: 180px;
    border-radius: 15px;
  }
  .kaitholas-thumb {
    height: 120px;
  }
  .kaitholas-arrow {
    font-size: 2rem;
    width: 2.3rem;
    height: 2.3rem;
    border-width: 1.5px;
    box-shadow: 0 2px 8px 0 #2222;
    background: #fff;
    color: #222;
  }
  .kaitholas-arrow:hover {
    background: #222;
    color: #fff;
    border: 1.5px solid #222;
  }
}

@media (max-width: 600px) {
  .kaitholas-header-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.8rem;
    padding: 0 0.5rem 1rem 0.5rem;
  }
  .kaitholas-title {
    font-size: 1.15rem;
  }
  .kaitholas-scroll-container {
    gap: 0.7rem;
    padding: 0 0.3rem;
  }
  .kaitholas-video-card, .kaitholas-thumb {
    min-width: 175px;
    max-width: 175px;
    height: 120px;
  }
  .kaitholas-video-card {
    height: 130px;
    border-radius: 12px;
  }
  .kaitholas-thumb {
    height: 78px;
  }
  .kaitholas-caption {
    font-size: 1rem;
    padding: 0.5rem 0.4rem;
  }
  /* Modern glassy, floating arrows for mobile */
  .kaitholas-arrow {
    position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
  }
  .kaitholas-arrow:hover {
    background: #222;
    color: #fff;
    border: 1.5px solid #222;
  }
}

.kaitholas-popup-bg {
  position: fixed;
  z-index: 2000;
  left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(30,40,60,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: kaitholas-popup-fadein 0.25s;
}
@keyframes kaitholas-popup-fadein {
  0% { opacity: 0;}
  100% { opacity: 1;}
}
.kaitholas-popup-content {
  background: #fff;
  padding: 1.5rem 1.5rem 1rem 1.5rem;
  border-radius: 18px;
  box-shadow: 0 14px 40px 0 #0004;
  max-width: 96vw;
  max-height: 95vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  animation: kaitholas-popup-zoom 0.22s;
}
@keyframes kaitholas-popup-zoom {
  0% { transform: scale(0.92);}
  100% { transform: scale(1);}
}
.kaitholas-popup-video {
  max-width: 88vw;
  max-height: 66vh;
  border-radius: 12px;
  margin-bottom: 0.6rem;
  background: #111;
}
.kaitholas-popup-caption {
  font-size: 1.15rem;
  color: #222;
  font-weight: 700;
  margin-top: 0.7rem;
  text-align: center;
}
.kaitholas-popup-close {
  position: absolute;
  top: 0.6rem;
  right: 1.1rem;
  background: none;
  border: none;
  font-size: 2.3rem;
  color: #222;
  cursor: pointer;
  opacity: 0.76;
  z-index: 5;
}
.kaitholas-popup-close:hover {
  color: #e21a1a;
  opacity: 1;
}

@media (max-width: 900px) {
  .kaitholas-popup-content {
    padding: 1rem 0.5rem 0.7rem 0.5rem;
  }
  .kaitholas-popup-video {
    max-width: 98vw;
    max-height: 40vh;
  }
}
@media (max-width: 600px) {
  .kaitholas-popup-content {
    padding: 0.6rem 0.2rem 0.2rem 0.2rem;
    border-radius: 13px;
  }
  .kaitholas-popup-video {
    max-width: 99vw;
    max-height: 35vh;
  }
  .kaitholas-popup-caption {
    font-size: 0.93rem;
  }
}
</style>
</head>
<body>
  <section class="kaitholas-video-section">
  <div class="kaitholas-header-row">
    <!-- <h2 class="kaitholas-title">Kaitholas Video Gallery</h2> -->
    <!-- Removed the Add Video button -->
  </div>
  <div class="kaitholas-scroll-container" id="kaitholasScrollContainer">
    <!-- Video cards injected by JS -->
  </div>
  <button class="kaitholas-arrow kaitholas-arrow-left" id="kaitholasLeftArrow" aria-label="Scroll Left">&#8678;</button>
  <button class="kaitholas-arrow kaitholas-arrow-right" id="kaitholasRightArrow" aria-label="Scroll Right">&#8680;</button>
  <!-- Popup -->
  <div class="kaitholas-popup-bg" id="kaitholasPopupBg" style="display:none">
    <div class="kaitholas-popup-content">
      <button class="kaitholas-popup-close" id="kaitholasPopupClose" aria-label="Close">&times;</button>
      <video class="kaitholas-popup-video" id="kaitholasPopupVideo" controls></video>
      <div class="kaitholas-popup-caption" id="kaitholasPopupCaption"></div>
    </div>
  </div>
</section>

  <script>
    // Kaitholas Video Gallery Logic (without add button)
const initialVideos = [
  { src: "public/video/kaitholas2.mp4", title: "Kaitholas 2" },
  { src: "public/video/kaitholas3.mp4", title: "Kaitholas 3" },
  { src: "public/video/kaitholas4.mp4", title: "Kaitholas 4" },
  { src: "public/video/kaitholas5.mp4", title: "Kaitholas 5" },
  { src: "public/video/kaitholas6.mp4", title: "Kaitholas 6" },
  { src: "public/video/kaitholas7.mp4", title: "Kaitholas 7" },
  { src: "public/video/kaitholas8.mp4", title: "Kaitholas 8" },
];

let kaitholasVideos = [...initialVideos];

// DOM Elements
const scrollContainer = document.getElementById('kaitholasScrollContainer');
const leftArrow = document.getElementById('kaitholasLeftArrow');
const rightArrow = document.getElementById('kaitholasRightArrow');
const popupBg = document.getElementById('kaitholasPopupBg');
const popupVideo = document.getElementById('kaitholasPopupVideo');
const popupCaption = document.getElementById('kaitholasPopupCaption');
const popupClose = document.getElementById('kaitholasPopupClose');

// Render videos
function renderVideos() {
  scrollContainer.innerHTML = '';
  kaitholasVideos.forEach((video, idx) => {
    const card = document.createElement('div');
    card.className = 'kaitholas-video-card';
    card.setAttribute('tabindex', '0');
    card.onclick = () => openPopup(idx);

    const vid = document.createElement('video');
    vid.className = 'kaitholas-thumb';
    vid.src = video.src;
    vid.muted = true;
    vid.loop = true;
    vid.preload = 'metadata';

    vid.onmouseover = () => vid.play();
    vid.onmouseout = () => vid.pause();

    const cap = document.createElement('span');
    cap.className = 'kaitholas-caption';
    cap.textContent = video.title;

    card.appendChild(vid);
    card.appendChild(cap);
    scrollContainer.appendChild(card);
  });
}

// Scroll
function handleScroll(direction) {
  const scrollAmount = scrollContainer.offsetWidth * 0.65;
  if (direction === 'right') {
    scrollContainer.scrollBy({ left: scrollAmount, behavior: "smooth" });
  } else {
    scrollContainer.scrollBy({ left: -scrollAmount, behavior: "smooth" });
  }
}

// Auto-move
let autoMoveInterval = setInterval(() => handleScroll('right'), 3500);

scrollContainer.addEventListener('mouseenter', () => clearInterval(autoMoveInterval));
scrollContainer.addEventListener('mouseleave', () => {
  autoMoveInterval = setInterval(() => handleScroll('right'), 3500);
});

// Arrows
leftArrow.onclick = () => handleScroll('left');
rightArrow.onclick = () => handleScroll('right');

// Popup logic
function openPopup(idx) {
  popupVideo.src = kaitholasVideos[idx].src;
  popupCaption.textContent = kaitholasVideos[idx].title;
  popupBg.style.display = 'flex';
  setTimeout(() => popupVideo.play(), 100);
}
function closePopup() {
  popupBg.style.display = 'none';
  popupVideo.pause();
  popupVideo.src = '';
}
popupClose.onclick = closePopup;
popupBg.onclick = (e) => {
  if (e.target.className.includes('kaitholas-popup-bg')) closePopup();
};
document.addEventListener('keydown', (e) => {
  if (popupBg.style.display === 'flex' && (e.key === 'Escape' || e.key === 'Esc')) closePopup();
});

// Initial render
renderVideos();
  </script>
