<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaikom Kaitholas - Chat Widget Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .demo-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .demo-container h1 {
            color: #000;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .demo-container p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .demo-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #000;
        }

        .demo-section h3 {
            color: #000;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Chatbot Widget Styles */
        .chatbot-bubble {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9998;
        }

        .chat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #000 0%, #333 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            font-size: 28px;
            border: 2px solid #fff;
        }

        .chat-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .chat-label {
            position: absolute;
            bottom: 75px;
            right: 0;
            background: #000;
            color: #fff;
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            animation: slideInUp 0.4s ease forwards;
            opacity: 0;
        }

        .chat-label.show {
            opacity: 1;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-window {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 400px;
            max-width: 95vw;
            height: 600px;
            max-height: 85vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 9999;
            transform: translateY(450px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            border: 1px solid #ddd;
        }

        .chat-window.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .chat-header {
            background: #000;
            color: #fff;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
        }

        .chat-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
        }

        .chat-close:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(90deg);
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafafa;
        }

        .chat-message {
            background: white;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            animation: messageAppear 0.3s ease;
            border-left: 3px solid #000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .chat-message.malayalam {
            font-family: 'Noto Sans Malayalam', 'Manjari', sans-serif;
            font-size: 14px;
        }

        .message-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .chat-option {
            background: #000;
            color: white;
            border: none;
            padding: 14px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-option:hover {
            background: #333;
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .chat-option.contact-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #20ba5c 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .chat-option.contact-whatsapp:hover {
            background: linear-gradient(135deg, #20ba5c 0%, #1a8e4b 100%);
            transform: translateX(5px);
        }

        .chat-option.contact-call {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .chat-option.contact-call:hover {
            background: linear-gradient(135deg, #ee5a52 0%, #d43f3f 100%);
            transform: translateX(5px);
        }

        .chat-option:active {
            transform: scale(0.98);
        }

        .chat-option a {
            color: white;
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .contact-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-number {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 2px;
        }

        /* Scrollbar styling */
        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #999;
            border-radius: 3px;
        }

        .chat-body::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .chat-window {
                width: 95vw;
                height: 70vh;
                bottom: 70px;
                right: 2.5vw;
            }

            .chat-icon {
                width: 55px;
                height: 55px;
                bottom: 20px;
                right: 20px;
            }

            .chat-label {
                font-size: 12px;
                padding: 10px 14px;
                bottom: 70px;
            }

            .demo-container {
                padding: 20px;
            }

            .demo-container h1 {
                font-size: 1.8em;
            }

            .chat-body {
                padding: 15px;
            }

            .chat-option {
                font-size: 13px;
                padding: 12px 14px;
            }
        }

        .language-toggle {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            transition: all 0.2s ease;
            margin-top: 10px;
            text-align: center;
        }

        .language-toggle:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    

    <!-- Chatbot Widget -->
    <div class="chatbot-bubble">
        <div class="chat-label show">Let's chat! 🎸</div>
        <div class="chat-icon">🎸</div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            Vaikom Kaitholas
            <button class="chat-close">✕</button>
        </div>
        <div class="chat-body">
            <div class="chat-message" id="greetingMessage">
                Hello! Welcome to Vaikom Kaitholas. How can we help you?
            </div>
            <div class="chat-options" id="chatOptions"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CHATBOT STATE MANAGEMENT & INTERACTION LOGIC
        // ============================================

        // Define the chat flow structure as a state machine
        const chatStates = {
            root: {
                message: "Hello! Welcome to Vaikom Kaitholas. How can we help you?",
                options: [
                    { label: "Band Enquiries", nextState: "bandEnquiries" },
                    { label: "Available Dates / Booking", nextState: "booking" },
                    { label: "What is Amaalavettu?", nextState: "amaalavettu" }
                ]
            },

            // Band Enquiries flow
            bandEnquiries: {
                message: "We are a music collective powered by purpose. Our mission is to amplify the voice of nature through powerful performances.",
                options: [
                    { label: "More about us", nextState: "moreAboutUs" },
                    { label: "Our music", nextState: "music" },
                    { label: "Get in touch", nextState: "contact" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            moreAboutUs: {
                message: "We blend traditional and contemporary sounds to create music that moves people. Every performance is a statement against exploitation and injustice.",
                options: [
                    { label: "Get in touch", nextState: "contact" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            music: {
                message: "Listen to our tracks on Spotify, YouTube, and all major streaming platforms. Search for 'Vaikom Kaitholas' to discover our resistance anthem.",
                options: [
                    { label: "Get in touch", nextState: "contact" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            // Booking flow
            booking: {
                message: "We perform at festivals, concerts, corporate events, and celebrations. Every performance carries our message of environmental consciousness and social justice.",
                options: [
                    { label: "Check availability", nextState: "checkAvailability" },
                    { label: "Get in touch", nextState: "contact" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            checkAvailability: {
                message: "For detailed availability and booking inquiries, please reach out to us directly. We'd love to bring our music to your event!",
                options: [
                    { label: "Get in touch", nextState: "contact" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            // Amaalavettu - Main flow
            amaalavettu: {
                message: "Amaalavettu is more than a name — it is our stance. Choose your language to learn more.",
                options: [
                    { label: "Read in English", nextState: "amaalavettuEnglish" },
                    { label: "വായിക്കുക മലയാളത്തിൽ", nextState: "amaalavettuMalayalam" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            amaalavettuEnglish: {
                message: "Amaalavettu is our resistance against the exploitation of nature. As forests fall and rivers are filled, entire ecosystems vanish. We stand as the voice of nature and advocates for environmental justice. Through music infused with the scent of our soil, we amplify the resistance of this land. We are Vaikom Kaitholas — bound by music, powered by purpose.",
                options: [
                    { label: "More of our vision", nextState: "visionEnglish" },
                    { label: "Get in touch", nextState: "contact" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            visionEnglish: {
                message: "We resist exploitation of nature, injustice, blind beliefs, addiction, caste discrimination, and apathy in politics. Through our songs, we become the voice of the voiceless, bringing light to future generations. Join us in this movement for change.",
                options: [
                    { label: "Get in touch", nextState: "contact" },
                    { label: "Back to menu", nextState: "root" }
                ]
            },

            amaalavettuMalayalam: {
                message: "അമാളവെട്ടു പ്രകൃതിയുടെ ചൂഷണത്തിനെതിരായ നമ്മുടെ പ്രതിരോധം ആണ്. കാടുകൾ നിരത്തപ്പെടുകയും നദികൾ നികത്തപ്പെടുകയും ചെയ്യുമ്പോൾ, മുഴുവൻ ആവാസവ്യവസ്ഥകളും അപ്രത്യക്ഷമാകുന്നു. നാം പ്രകൃതിയുടെ വാണിയും പരിസ്ഥിതി നീതിയുടെ പ്രവാചകനുമാണ്. നമ്മുടെ മണ്ണിന്റെ സുഗന്ധം വഹിക്കുന്ന സംഗീതത്തിലൂടെ, ഈ ഭൂമിയുടെ പ്രതിരോധത്തെ ഞങ്ങൾ ശക്തിപ്പെടുത്തുന്നു. ഞങ്ങൾ വൈകം കൈതോലസ് — സംഗീതത്താൽ ബന്ധപ്പെട്ട, ലക്ഷ്യത്താൽ ചാലിത.",
                options: [
                    { label: "നമ്മുടെ കാഴ്ചപ്പാട്", nextState: "visionMalayalam" },
                    { label: "ഞങ്ങളെ ബന്ധപ്പെടുക", nextState: "contact" },
                    { label: "മെനുവിലേക്ക് മടങ്ങുക", nextState: "root" }
                ]
            },

            visionMalayalam: {
                message: "ഞങ്ങൾ പ്രകൃതിയുടെ ചൂഷണം, അനീതി, അന്ധമായ വിശ്വാസങ്ങൾ, ലഹരി, വർണ്ണ വിവേചനം, രാഷ്ട്രീയ നിസ്സംഗതയ്ക്കെതിരെ പ്രതിരോധിക്കുന്നു. നമ്മുടെ പാട്ടുകളിലൂടെ, ഞങ്ങൾ നിരാലംബിതരുടെ കണ്ണിയും വരാനിരിക്കുന്ന തലമുറകളിലേക്ക് പ്രകാശം കൊണ്ടുവരുന്നു.",
                options: [
                    { label: "ഞങ്ങളെ ബന്ധപ്പെടുക", nextState: "contact" },
                    { label: "മെനുവിലേക്ക് മടങ്ങുക", nextState: "root" }
                ]
            },

            // Contact flow - FINAL STATE
            contact: {
                message: "We'd love to hear from you! Reach out to us through your preferred channel:",
                options: [
                    { label: "contact-whatsapp", action: "whatsapp", value: "+919876543210" },
                    { label: "contact-call", action: "call", value: "+919876543210" },
                    { label: "Back to menu", nextState: "root" }
                ]
            }
        };

        // DOM Elements
        const chatBubble = document.querySelector('.chatbot-bubble');
        const chatIcon = document.querySelector('.chat-icon');
        const chatLabel = document.querySelector('.chat-label');
        const chatWindow = document.querySelector('.chat-window');
        const chatBody = document.querySelector('.chat-body');
        const chatOptions = document.getElementById('chatOptions');
        const closeButton = document.querySelector('.chat-close');
        const greetingMessage = document.getElementById('greetingMessage');

        let currentState = 'root';

        /**
         * Render the current chat state
         * Updates the message and options based on currentState
         */
        function renderChatState() {
            const state = chatStates[currentState];

            if (!state) {
                console.error(`State '${currentState}' not found`);
                return;
            }

            // Update greeting message
            const isMalayalam = currentState.includes('Malayalam');
            greetingMessage.textContent = state.message;
            if (isMalayalam) {
                greetingMessage.classList.add('malayalam');
            } else {
                greetingMessage.classList.remove('malayalam');
            }

            // Clear existing options
            chatOptions.innerHTML = '';

            // Render each option as a button
            state.options.forEach((option) => {
                const button = document.createElement('button');
                button.className = 'chat-option';

                if (option.action === 'whatsapp') {
                    button.classList.add('contact-whatsapp');
                    button.innerHTML = `
                        <a href="https://wa.me/${option.value.replace(/\+/g, '').replace(/\s/g, '')}?text=Hi%20Vaikom%20Kaitholas%2C%20I%27d%20like%20to%20know%20more%20about%20your%20services" style="display: flex; align-items: center; width: 100%;">
                            <span class="contact-icon">💬</span>
                            <span class="contact-info">
                                <div>WhatsApp</div>
                                <div class="contact-number">${option.value}</div>
                            </span>
                        </a>
                    `;
                } else if (option.action === 'call') {
                    button.classList.add('contact-call');
                    button.innerHTML = `
                        <a href="tel:${option.value}" style="display: flex; align-items: center; width: 100%;">
                            <span class="contact-icon">📞</span>
                            <span class="contact-info">
                                <div>Call Us</div>
                                <div class="contact-number">${option.value}</div>
                            </span>
                        </a>
                    `;
                } else {
                    button.textContent = option.label;
                    button.addEventListener('click', () => {
                        currentState = option.nextState;
                        renderChatState();
                        setTimeout(() => {
                            chatBody.scrollTop = chatBody.scrollHeight;
                        }, 100);
                    });
                }

                chatOptions.appendChild(button);
            });
        }

        /**
         * Open the chat window
         */
        function openChat() {
            chatWindow.classList.add('open');
            chatLabel.classList.remove('show');
            currentState = 'root';
            renderChatState();
        }

        /**
         * Close the chat window
         */
        function closeChat() {
            chatWindow.classList.remove('open');
            chatLabel.classList.add('show');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        chatIcon.addEventListener('click', openChat);
        chatLabel.addEventListener('click', openChat);
        closeButton.addEventListener('click', closeChat);

        // Initialize chat on page load
        renderChatState();
    </script>
</body>
</html>
