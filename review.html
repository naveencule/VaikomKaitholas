<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Demo content */
        .demo-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .demo-content h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .demo-content p {
            line-height: 1.6;
            color: #666;
            margin-bottom: 15px;
        }

        /* Fixed contact widget */
        .contact-widget-container {
            position: fixed;
            right: 20px;
            bottom: 25px;
            z-index: 1000;
        }

        /* Main toggle button */
        .contact-toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            border: none;
        }

        .contact-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .contact-toggle-btn.active {
            transform: rotate(45deg);
        }

        .contact-toggle-btn svg {
            width: 28px;
            height: 28px;
            transition: transform 0.3s ease;
        }

        /* Dropdown menu */
        .contact-dropdown {
            position: absolute;
            bottom: 75px;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .contact-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Individual contact buttons */
        .contact-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: white;
            border-radius: 50px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: 180px;
        }

        .contact-option:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        .contact-option-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .contact-option-text {
            font-weight: 500;
            font-size: 15px;
        }

        /* Phone icon */
        .phone-icon {
            background: #34B7F1;
        }

        /* WhatsApp icon */
        .whatsapp-icon {
            background: #25D366;
        }

        /* Instagram icon */
        .instagram-icon {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* Google icon */
        .google-icon {
            background: #ffffff;
            border: 2px solid #e0e0e0;
        }

        .contact-option-icon svg {
            width: 22px;
            height: 22px;
        }

        /* Animation delay for staggered effect */
        .contact-dropdown.active .contact-option:nth-child(1) {
            transition-delay: 0.05s;
        }
        .contact-dropdown.active .contact-option:nth-child(2) {
            transition-delay: 0.1s;
        }
        .contact-dropdown.active .contact-option:nth-child(3) {
            transition-delay: 0.15s;
        }
        .contact-dropdown.active .contact-option:nth-child(4) {
            transition-delay: 0.2s;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .contact-widget-container {
                right: 15px;
                bottom: 20px;
            }

            .contact-option {
                min-width: 160px;
                padding: 10px 15px;
            }

            .contact-option-icon {
                width: 36px;
                height: 36px;
            }

            .contact-option-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Demo Content -->
    <div class="demo-content">
        <h1>Your Website Content</h1>
        <p>This is your main content area. Click the contact button in the bottom right to see the dropdown menu.</p>
