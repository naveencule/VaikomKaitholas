<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


    <style>

        /* Spacer sections */
        .spacer {
            height: 100vh;
            background: linear-gradient(45deg, #1a1a1a, #0f0f0f);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2rem;
        }

        /* Common section styles */
        .horizontal-section {
            height: 80vh;
            overflow: hidden;
            position: relative;
            background: #ffffff;
            padding-top: 80px;
        }

        .section-content {
            display: flex;
            align-items: center;
            height: calc(100% - 80px);
            will-change: transform;
            transition: transform 0.1s linear;
            padding: 0 50px;
        }

        .ssection-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #000000;
            font-size: 2.5rem;
            font-weight: 600;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Card styles */
        .card {
            min-width: 320px;
            margin: 0 20px;
            background: linear-gradient(140deg, #0a0a0a, #866a35);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
        }

        .card-photo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffffff33;
            margin: 0 auto 20px;
            display: block;
            background: linear-gradient(45deg, #333, #555);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card-photo:hover {
            border-color: #ffffff66;
            transform: scale(1.05);
        }

        .card-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-role {
            font-size: 1rem;
            color: #bbbbbb;
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-arrow:hover {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(0, 0, 0, 0.5);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-arrow.left {
            left: 20px;
        }

        .nav-arrow.right {
            right: 20px;
        }

        .nav-arrow svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }

        .nav-arrow.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Progress indicator */
        .scroll-progress {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #000;
            transform: scale(1.2);
        }

        /* Popup Modal Styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            background: linear-gradient(140deg, #0a0a0a, #866a35);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transform: scale(0.8);
            transition: all 0.3s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .popup-overlay.active .popup-content {
            transform: scale(1);
        }

        .popup-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: block;
            border: 3px solid #ffffff33;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .popup-image:hover {
            transform: scale(1.05);
        }

        .popup-image.fullscreen {
            width: 90vw;
            max-width: 600px;
            height: auto;
            max-height: 90vh;
            border-radius: 10px;
            object-fit: contain;
        }

        .popup-name {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .popup-role {
            font-size: 1.2rem;
            color: #bbbbbb;
            margin-bottom: 20px;
        }

        .popup-bio {
            font-size: 1rem;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 20px;
        }

        .popup-instagram {
            margin-top: 20px;
        }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }

        .instagram-link:hover {
            transform: scale(1.05);
        }

        .instagram-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .popup-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .popup-close:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
        }

        .popup-close svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .card {
                min-width: 280px;
                margin: 0 15px;
                padding: 25px 15px;
            }

            .card-photo {
                width: 100px;
                height: 100px;
            }

            .card-name {
                font-size: 1.3rem;
            }

            .card-role {
                font-size: 0.95rem;
            }

            .ssection-title {
                font-size: 2rem;
                top: 15px;
                padding: 8px 20px;
            }

            .horizontal-section {
                padding-top: 70px;
            }

            .section-content {
                height: calc(100% - 70px);
                padding: 0 30px;
            }

            .popup-content {
                padding: 30px 20px;
                max-width: 350px;
            }

            .popup-image {
                width: 150px;
                height: 150px;
            }

            .popup-name {
                font-size: 1.5rem;
            }

            .popup-role {
                font-size: 1rem;
            }

            .popup-bio {
                font-size: 0.9rem;
            }
        }
    </style>

function closePopup() {
    const popup = document.getElementById('popup-overlay');
    const image = document.getElementById('popup-image');

    popup.classList.remove('active');
    image.classList.remove('fullscreen');

function toggleFullscreen() {
    const image = document.getElementById('popup-image');
    image.classList.toggle('fullscreen');
}

// Close popup on Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closePopup();
    }
});

// Manual scroll positions for each section
let scrollPositions = {
    managers: 0,
    artists: 0
};

const maxScrollPositions = {
    managers: 6, // 6 cards - 1
    artists: 9   // 10 cards - 1
};

// Smooth horizontal scrolling animation
function initHorizontalScroll() {
    const managersSection = document.getElementById('managers-section');
    const managersContent = document.getElementById('managers-content');
    const artistsSection = document.getElementById('artists-section');
    const artistsContent = document.getElementById('artists-content');

    function updateScrollAnimations() {
        const scrollY = window.scrollY;
        const windowHeight = window.innerHeight;

        // Managers section animation
        const managersRect = managersSection.getBoundingClientRect();
        if (managersRect.top <= windowHeight && managersRect.bottom >= 0) {
            const progress = Math.max(0, Math.min(1, (windowHeight - managersRect.top) / windowHeight));
            const translateX = -progress * 50; // Slide from right to left
            managersContent.style.transform = `translateX(${translateX}%)`;
        }

        // Artists section animation  
        const artistsRect = artistsSection.getBoundingClientRect();
        if (artistsRect.top <= windowHeight && artistsRect.bottom >= 0) {
            const progress = Math.max(0, Math.min(1, (windowHeight - artistsRect.top) / windowHeight));
            const translateX = progress * 50 - 50; // Slide from left to right
            artistsContent.style.transform = `translateX(${translateX}%)`;
        }
    }

    // Use requestAnimationFrame for smooth performance
    let ticking = false;
    function requestTick() {
        if (!ticking) {
            requestAnimationFrame(updateScrollAnimations);
            ticking = true;
            setTimeout(() => ticking = false, 16); // ~60fps
        }
    }

    window.addEventListener('scroll', requestTick);
    updateScrollAnimations(); // Initial call
}

// Manual scroll function for arrows
function scrollSection(section, direction) {
    const currentPos = scrollPositions[section];
    const newPos = Math.max(0, Math.min(maxScrollPositions[section], currentPos + direction));
    
    if (newPos !== currentPos) {
        scrollPositions[section] = newPos;
        updateManualScroll(section);
        updateProgressDots(section);
        updateArrowStates(section);
    }
}

// Update manual scroll position
function updateManualScroll(section) {
    const content = document.getElementById(`${section}-content`);
    const cardWidth = 360; // card width + margin
    const translateX = -scrollPositions[section] * cardWidth;
    
    // Override the scroll-based animation temporarily
    content.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    content.style.transform = `translateX(${translateX}px)`;
    
    // Reset transition after animation
    setTimeout(() => {
        content.style.transition = 'transform 0.1s linear';
    }, 500);
}

// Update progress dots
function updateProgressDots(section) {
    const progressContainer = document.getElementById(`${section}-progress`);
    const dots = progressContainer.querySelectorAll('.progress-dot');
    
    dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === scrollPositions[section]);
    });
}

// Update arrow states
function updateArrowStates(section) {
    const leftArrow = document.getElementById(`${section}-left`);
    const rightArrow = document.getElementById(`${section}-right`);
    
    leftArrow.classList.toggle('disabled', scrollPositions[section] === 0);
    rightArrow.classList.toggle('disabled', scrollPositions[section] === maxScrollPositions[section]);
}

// Initialize progress dots and arrows
function initManualControls() {
    ['managers', 'artists'].forEach(section => {
        updateProgressDots(section);
        updateArrowStates(section);
    });
}

// Intersection Observer for performance optimization
function initIntersectionObserver() {
    const sections = document.querySelectorAll('.horizontal-section');
    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('in-view');
            }
        });
    }, {
        threshold: 0.1,
        rootMargin: '50px'
    });

    sections.forEach(section => observer.observe(section));
}

// Smooth scroll behavior
function addSmoothScrollBehavior() {
    document.documentElement.style.scrollBehavior = 'smooth';
}

// Initialize everything when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
    initHorizontalScroll();
    initIntersectionObserver();
    addSmoothScrollBehavior();
    initManualControls();

    // Touch events for swipe
    const managersContent = document.getElementById('managers-content');
    const artistsContent = document.getElementById('artists-content');

    managersContent.addEventListener('touchstart', (e) => handleTouchStart(e, 'managers'));
    managersContent.addEventListener('touchend', (e) => handleTouchEnd(e, 'managers'));

    artistsContent.addEventListener('touchstart', (e) => handleTouchStart(e, 'artists'));
    artistsContent.addEventListener('touchend', (e) => handleTouchEnd(e, 'artists'));
});

// Handle resize for responsive behavior
window.addEventListener('resize', () => {
    setTimeout(() => {
        const event = new Event('scroll');
        window.dispatchEvent(event);
        ['managers', 'artists'].forEach(section => {
            updateManualScroll(section);
        });
    }, 100);
});

// Touch/swipe support for mobile
let touchStartX = 0;
let touchEndX = 0;
let currentSection = null;

function handleTouchStart(e, section) {
    touchStartX = e.changedTouches[0].screenX;
    currentSection = section;
}

function handleTouchEnd(e, section) {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe(section);
}

function handleSwipe(section) {
    const swipeThreshold = 50;
    const swipeDistance = touchStartX - touchEndX;
    
    if (Math.abs(swipeDistance) > swipeThreshold) {
        if (swipeDistance > 0) {
            // Swipe left - go to next
            scrollSection(section, 1);
        } else {
            // Swipe right - go to previous
            scrollSection(section, -1);
        }
    }
}

// EXPOSE FUNCTIONS TO GLOBAL SCOPE FOR INLINE ONCLICK
window.openPopup = openPopup;
window.closePopup = closePopup;
window.toggleFullscreen = toggleFullscreen;
window.scrollSection = scrollSection;

</script>
