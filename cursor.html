// --- 3. Core Functions for UI Manipulation (UNCHANGED) ---

/**
 * Creates and appends a message bubble to the chat body.
 */
function addMessage(text, type = 'bot') {
    const messageDiv = document.createElement('div');
    messageDiv.className = `vk-message vk-${type}-message`;
    messageDiv.innerHTML = text.replace(/\n/g, '<br>'); 
    chatBody.appendChild(messageDiv);
    chatBody.scrollTop = chatBody.scrollHeight;
}

/**
 * Clears and injects action buttons based on the current step/language.
 */
function displayOptions(buttons, handler) {
    chatActions.innerHTML = ''; 
    
    buttons.forEach(option => {
        const button = document.createElement('button');
        button.className = 'vk-option-button';
        button.textContent = option.text;
        button.setAttribute('data-id', option.id);
        button.addEventListener('click', () => handler(option.id));
        chatActions.appendChild(button);
    });
}

/**
 * Toggles the visibility of the main chat window and CTA label.
 * MODIFIED: This function now only calls startChat() if the chat body is empty,
 * allowing the user to resume their previous conversation.
 */
function toggleChat() {
    const isHidden = chatWindow.classList.toggle('hidden');
    ctaLabel.classList.toggle('hidden', !isHidden); // Hide CTA when window is open
    
    if (!isHidden) {
        // If chat is being opened and the body is empty (first time), start the chat.
        if (chatBody.children.length === 0) {
            startChat();
        } else {
             // If chat is being reopened, scroll to the bottom of the last message
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    }
}

// --- 4. Chat Flow Management Logic (UNCHANGED EXCEPT FOR INITIAL STATE) ---

/**
 * Starts the chat by clearing content and displaying language selection (Step 1).
 */
function startChat() {
    chatBody.innerHTML = '';
    contactOptions.classList.add('hidden'); // Hide contact options initially
    currentLang = null;
    currentStep = 1;

    // Display the bilingual welcome message
    addMessage(CONTENT.STEP1_GREETING.en + ' / ' + CONTENT.STEP1_GREETING.ml);
    
    // Display language selection buttons
    displayOptions([
        { id: 'en', text: "English" },
        { id: 'ml', text: "മലയാളം" }
    ], handleLanguageSelection);
}

/**
 * Handles the selection of the language. (UNCHANGED)
 */
function handleLanguageSelection(lang) {
    currentLang = lang;
    currentStep = 2;
    
    chatActions.innerHTML = ''; 

    const langText = lang === 'en' ? 'English' : 'മലയാളം';
    addMessage(langText, 'user');
    
    displayMainMenu();
}

/**
 * Displays the main menu options (Step 2). (UNCHANGED)
 */
function displayMainMenu() {
    if (!currentLang) return; 

    addMessage(CONTENT.STEP2_GREETING[currentLang]);
    
    displayOptions(CONTENT.OPTIONS[currentLang], handleMainMenuSelection);
    
    contactOptions.classList.remove('hidden'); 
}

/**
 * Handles clicks on the main menu options, including 'Back to Main Menu'. (UNCHANGED)
 */
function handleMainMenuSelection(optionId) {
    if (!currentLang) return; 
    
    if (optionId === 'menu') {
        chatActions.innerHTML = '';
        displayMainMenu();
        chatBody.scrollTop = chatBody.scrollHeight;
        return;
    }
    
    const userOptionText = CONTENT.OPTIONS[currentLang].find(opt => opt.id === optionId)?.text || '';
    addMessage(userOptionText, 'user');

    chatActions.innerHTML = '';
    
    let botResponseText = '';

    if (optionId === 'aamalavettu') {
        botResponseText = CONTENT.AAMALAVETTU_RESPONSE[currentLang];
    } else if (CONTENT.GENERIC_RESPONSE[optionId]) {
        botResponseText = CONTENT.GENERIC_RESPONSE[optionId][currentLang];
    }
    
    addMessage(botResponseText);

    contactOptions.classList.remove('hidden');

    setTimeout(() => {
        addMessage(currentLang === 'en' ? "Is there anything else?" : "മറ്റെന്തെങ്കിലും അറിയാനുണ്ടോ?");
        displayOptions([{ id: 'menu', text: currentLang === 'en' ? "Back to Main Menu" : "പ്രധാന മെനുവിലേക്ക് തിരികെ" }], handleMainMenuSelection);
    }, 500); 
}
