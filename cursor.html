

    <style>
        

        /* Main Cursor */
        .cursor-main {
            position: fixed;
            width: 25px;
            height: 25px;
            border: 2.5px solid #FFD700;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Inner dot */
        .cursor-main::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        /* Outer glow ring */
        .cursor-main::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 35px;
            border: 1.5px solid rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Cursor trail particles */
        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            border-radius: 50%;
        }

        /* Bigger outer ring for velocity effect */
        .cursor-ring {
            position: fixed;
            width: 50px;
            height: 50px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9997;
            transform: translate(-50%, -50%);
        }

        

        


    </style>

    <div class="cursor-main"></div>
    <div class="cursor-ring"></div>

    

    <script>
        const cursorMain = document.querySelector('.cursor-main');
        const cursorRing = document.querySelector('.cursor-ring');
        
        let mouseX = 0;
        let mouseY = 0;
        let cursorX = 0;
        let cursorY = 0;
        let ringX = 0;
        let ringY = 0;
        let velocityX = 0;
        let velocityY = 0;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Calculate velocity
            velocityX = mouseX - cursorX;
            velocityY = mouseY - cursorY;

            // Create enhanced trail particles
            createEnhancedTrail(mouseX, mouseY, velocityX, velocityY);
        });

        // Touch support for mobile
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;

                // Calculate velocity
                velocityX = mouseX - cursorX;
                velocityY = mouseY - cursorY;

                // Create enhanced trail particles
                createEnhancedTrail(mouseX, mouseY, velocityX, velocityY);
            }
        }, { passive: true });

        // Create enhanced trail with velocity-based particles
        function createEnhancedTrail(x, y, vx, vy) {
            if (Math.random() > 0.7) {
                const trail = document.createElement('div');
                trail.className = 'cursor-trail';
                
                const size = Math.random() * 8 + 3;
                const opacity = Math.random() * 0.7 + 0.3;
                
                trail.style.width = size + 'px';
                trail.style.height = size + 'px';
                trail.style.left = x + 'px';
                trail.style.top = y + 'px';
                trail.style.background = `rgba(255, 215, 0, ${opacity})`;
                trail.style.boxShadow = `0 0 ${size * 2}px rgba(255, 215, 0, ${opacity * 0.8})`;
                
                document.body.appendChild(trail);

                // Animate trail particle with velocity
                let tx = x;
                let ty = y;
                let tvx = vx * 0.05;
                let tvy = vy * 0.05;
                let opacity_val = opacity;
                let life = 0;
                const maxLife = 30;

                const trailInterval = setInterval(() => {
                    life++;
                    tx += tvx;
                    ty += tvy;
                    tvx *= 0.95;
                    tvy *= 0.95;
                    opacity_val -= opacity / maxLife;

                    trail.style.left = tx + 'px';
                    trail.style.top = ty + 'px';
                    trail.style.opacity = opacity_val;

                    if (life >= maxLife) {
                        clearInterval(trailInterval);
                        trail.remove();
                    }
                }, 16);
            }
        }

        // Smooth cursor animation with easing
        function animate() {
            // Cursor movement with smooth easing
            const easing = 0.18;
            cursorX += (mouseX - cursorX) * easing;
            cursorY += (mouseY - cursorY) * easing;

            // Ring follows with more lag for visual effect
            ringX += (mouseX - ringX) * 0.08;
            ringY += (mouseY - ringY) * 0.08;

            cursorMain.style.left = cursorX + 'px';
            cursorMain.style.top = cursorY + 'px';

            cursorRing.style.left = ringX + 'px';
            cursorRing.style.top = ringY + 'px';

            requestAnimationFrame(animate);
        }

        animate();

        // Click effect
        document.addEventListener('mousedown', () => {
            cursorMain.style.transform = 'translate(-50%, -50%) scale(0.8)';
        });

        document.addEventListener('mouseup', () => {
            cursorMain.style.transform = 'translate(-50%, -50%) scale(1)';
        });

        // Touch effects for mobile
        document.addEventListener('touchstart', () => {
            cursorMain.style.transform = 'translate(-50%, -50%) scale(0.8)';
        }, { passive: true });

        document.addEventListener('touchend', () => {
            cursorMain.style.transform = 'translate(-50%, -50%) scale(1)';
        }, { passive: true });

        // Hide cursor on mouse leave
        document.addEventListener('mouseleave', () => {
            cursorMain.style.opacity = '0';
            cursorRing.style.opacity = '0';
        });

        document.addEventListener('mouseenter', () => {
            cursorMain.style.opacity = '1';
            cursorRing.style.opacity = '1';
        });

        // Smooth transition style
        cursorMain.style.transition = 'opacity 0.3s ease';
        cursorRing.style.transition = 'opacity 0.3s ease';
    </script>
